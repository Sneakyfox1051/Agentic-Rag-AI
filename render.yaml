services:
  - type: web
    name: agentic-rag-api
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      cd frontend
      npm install
      npm run build
      cd ..
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: USE_MOCK
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: NODE_VERSION
        value: "18.18.0"
