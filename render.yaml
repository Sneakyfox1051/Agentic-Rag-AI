services:
  - type: web
    name: agentic-rag-api
    env: python
    plan: free
    buildCommand: |
      python3.11 -m pip install --upgrade pip setuptools wheel
      python3.11 -m pip install -r requirements.txt
      cd frontend
      npm install
      npm run build
      cd ..
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: USE_MOCK
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NODE_VERSION
        value: "20.11.0"
